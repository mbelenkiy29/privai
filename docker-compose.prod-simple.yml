services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privategpt_demo_2024}
      POSTGRES_DB: privategpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-privategpt_redis_2024}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-privategpt_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-privategpt_demo_2024}
      - POSTGRES_DB=privategpt
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-privategpt_redis_2024}
      - VESPA_CLOUD_CERT_PATH=/certs/vespa-cert.pem
      - VESPA_CLOUD_KEY_PATH=/certs/vespa-key.pem
      - VESPA_CLOUD_CERT_B64=${VESPA_CLOUD_CERT_B64}
      - VESPA_CLOUD_KEY_B64=${VESPA_CLOUD_KEY_B64}
      - OVERRIDE_API_PRODUCTION=true
    volumes:
      - ./certs:/certs:ro

volumes:
  pgdata:
  redisdata:
